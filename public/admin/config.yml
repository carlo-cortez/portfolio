backend:
  name: github
  repo: carlo-cortez/portfolio
  branch: main
  # Free public OAuth gateway for Sveltia CMS / Decap on Vercel
  base_url: https://sveltia-cms-auth.vercel.app

media_folder: public/images
public_folder: /images

collections:
  - name: projects
    label: Projects
    folder: src/content/projects
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: string }
      - { label: Tags, name: tags, widget: list, default: [] }
      - { label: Date, name: date, widget: datetime, format: "YYYY-MM-DD" }
      - { label: Featured, name: featured, widget: boolean, default: false }
      - { label: Image, name: image, widget: image, required: false }
      - { label: GitHub URL, name: github, widget: string, required: false }
      - { label: Live URL, name: live, widget: string, required: false }
      - { label: Body, name: body, widget: markdown }
